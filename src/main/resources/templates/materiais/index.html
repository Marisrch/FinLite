
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Materiais', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Materiais</h1>
            <p>Gerencie os materiais utilizados no seu negócio.</p>
        </div>

        <a th:href="@{/materiais/novo}" class="btn-primary">
            + Novo material
        </a>
    </div>

    <div th:if="${sucesso}" class="alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert-error"
         th:text="${erro}"></div>

    <div th:if="${materiais == null or materiais.isEmpty()}">
        <p>Nenhum material cadastrado até o momento.</p>
    </div>

    <table th:if="${materiais != null and !materiais.isEmpty()}">

        <thead>
        <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Marca</th>
            <th>Unidade</th>
            <th>Estoque atual</th>
            <th>Estoque mínimo</th>
            <th>Custo unitário</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="material : ${materiais}">
            <td th:text="${material.nomeMaterial}"></td>
            <td th:text="${material.categoriaMaterial}"></td>
            <td th:text="${material.marcaMaterial ?: '-'}"></td>
            <td th:text="${material.unidadeMedidaMaterial}"></td>
            <td th:text="${material.quantidadeEstoqueMaterial}"></td>
            <td th:text="${material.quantidadeMinimaMaterial}"></td>
            <td th:text="${material.custoUnitarioMaterial != null
                    ? 'R$ ' + material.custoUnitarioMaterial
                    : '-'}"></td>
        </tr>
        </tbody>

    </table>

</section>

</body>
</html>
