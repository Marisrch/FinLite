
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Receitas', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1 th:text="${lancamento.idLancamento == null
                ? 'Nova receita'
                : 'Editar receita'}">
                Nova receita
            </h1>

            <p th:text="${lancamento.idLancamento == null
                ? 'Registre uma receita adicional do seu negócio.'
                : 'Atualize as informações desta receita.'}">
                Registre uma receita adicional do seu negócio.
            </p>
        </div>
    </div>

    <div th:if="${erro}"
         class="alert alert-error"
         role="alert"
         th:text="${erro}">
    </div>

    <div th:if="${sucesso}"
         class="alert alert-success"
         role="alert"
         th:text="${sucesso}">
    </div>

    <form class="form-card"
          th:if="${idEmpreendedor != null}"
          th:action="@{/receitas/salvar}"
          th:object="${lancamento}"
          method="post">

        <input type="hidden"
               th:field="*{idLancamento}">

        <input type="hidden"
               name="idEmpreendedor"
               th:value="${idEmpreendedor}">

        <input type="hidden"
               name="tipoLancamento"
               value="RECEITA">

        <div class="form-group">
            <label for="dataLancamento">Data da receita</label>

            <input type="date"
                   id="dataLancamento"
                   name="dataLancamento"
                   th:value="${lancamento.dataLancamento != null
                       ? #temporals.format(lancamento.dataLancamento, 'yyyy-MM-dd')
                       : ''}"
                   th:classappend="${#fields.hasErrors('dataLancamento')} ? 'is-invalid' : ''">

            <small class="field-error"
                   th:if="${#fields.hasErrors('dataLancamento')}"
                   th:errors="*{dataLancamento}">
            </small>
        </div>

        <div class="form-group">
            <label for="descricaoLancamento">Descrição</label>

            <input type="text"
                   id="descricaoLancamento"
                   th:field="*{descricaoLancamento}"
                   th:classappend="${#fields.hasErrors('descricaoLancamento')} ? 'is-invalid' : ''"
                   maxlength="255"
                   placeholder="Ex.: Serviço de artesanato">

            <small class="field-error"
                   th:if="${#fields.hasErrors('descricaoLancamento')}"
                   th:errors="*{descricaoLancamento}">
            </small>
        </div>

        <div class="form-group">
            <label for="categoriaLancamento">Categoria</label>

            <select id="categoriaLancamento"
                    th:field="*{categoriaLancamento}"
                    th:classappend="${#fields.hasErrors('categoriaLancamento')} ? 'is-invalid' : ''">

                <option value="">Selecione</option>
                <option value="SERVIÇOS">Serviços</option>
                <option value="VENDAS">Vendas diversas</option>
                <option value="ENCOMENDAS">Encomendas</option>
                <option value="OUTROS">Outros</option>
            </select>

            <small class="field-error"
                   th:if="${#fields.hasErrors('categoriaLancamento')}"
                   th:errors="*{categoriaLancamento}">
            </small>
        </div>

        <div class="form-group">
            <label for="valorTotalLancamento">
                Valor total da receita (R$)
            </label>

            <input type="number"
                   id="valorTotalLancamento"
                   th:field="*{valorTotalLancamento}"
                   th:classappend="${#fields.hasErrors('valorTotalLancamento')} ? 'is-invalid' : ''"
                   step="0.01"
                   placeholder="Ex.: 150.00">

            <small class="field-error"
                   th:if="${#fields.hasErrors('valorTotalLancamento')}"
                   th:errors="*{valorTotalLancamento}">
            </small>
        </div>

        <div class="form-actions">
            <a th:href="@{/receitas}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit"
                    class="btn-primary"
                    th:text="${lancamento.idLancamento == null
                        ? 'Salvar receita'
                        : 'Atualizar receita'}">
                Salvar receita
            </button>
        </div>

    </form>

    <div th:if="${idEmpreendedor == null}">
        <p>Cadastre um empreendedor antes de registrar receitas.</p>

        <a th:href="@{/empreendedores/novo}"
           class="btn-primary">
            Cadastrar empreendedor
        </a>
    </div>

</section>
</body>
</html>
