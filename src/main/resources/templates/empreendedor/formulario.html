
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Novo empreendedor', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

  <div class="page-header">
    <div>
      <h1>Novo empreendedor</h1>
      <p>Cadastre os dados do responsável pelo negócio.</p>
    </div>
  </div>

  <div th:if="${sucesso}"
       class="alert alert-success"
       th:text="${sucesso}">
  </div>

  <div th:if="${erro}"
       class="alert alert-error"
       role="alert"
       th:text="${erro}">
  </div>

  <form class="form-card"
        th:action="@{/empreendedores/salvar}"
        th:object="${empreendedor}"
        method="post">

    <div class="form-group">
      <label for="nomeEmpreendedor">Nome completo</label>
      <input type="text"
             th:field="*{nomeEmpreendedor}"
             maxlength="100"
             required>
    </div>

    <div class="form-group">
      <label for="cpfEmpreendedor">CPF</label>
      <input type="text"
             th:field="*{cpfEmpreendedor}"
             id="cpfEmpreendedor"
             maxlength="14"
             placeholder="000.000.000-00"
             inputmode="numeric"
             autocomplete="off">
    </div>

    <div class="form-group">
      <label for="emailEmpreendedor">E-mail</label>
      <input type="email"
             th:field="*{emailEmpreendedor}"
             maxlength="100">
    </div>

    <div class="form-group">
      <label for="telefoneEmpreendedor">Telefone</label>
      <input type="text"
             th:field="*{telefoneEmpreendedor}"
             maxlength="20">
    </div>

    <div class="form-actions">
      <a th:href="@{/}" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-primary">
        Salvar empreendedor
      </button>
    </div>

  </form>

</section>
</body>
</html>
