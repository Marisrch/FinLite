<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Novo empreendedor', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

  <h1>Novo empreendedor</h1>
  <p>Cadastre os dados do responsável pelo negócio.</p>

  <form th:action="@{/empreendedores/salvar}"
        th:object="${empreendedor}"
        method="post">

    <label>Nome completo</label>
    <input type="text"
           th:field="*{nomeEmpreendedor}"
           maxlength="100"
           required>

    <label>CPF</label>
    <input type="text"
           th:field="*{cpfEmpreendedor}"
           maxlength="11"
           placeholder="Somente números">

    <label>E-mail</label>
    <input type="email"
           th:field="*{emailEmpreendedor}"
           maxlength="100">

    <label>Telefone</label>
    <input type="text"
           th:field="*{telefoneEmpreendedor}"
           maxlength="20">

    <button type="submit">Salvar empreendedor</button>
    <a th:href="@{/}">Cancelar</a>

  </form>

</section>
</body>
</html>
