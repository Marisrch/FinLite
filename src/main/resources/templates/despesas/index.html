
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Despesas', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Despesas</h1>
            <p>Consulte e gerencie os lançamentos financeiros do seu negócio.</p>
        </div>

        <a th:href="@{/despesas/novo}" class="btn-primary">
            + Nova despesa
        </a>
    </div>

    <div th:if="${sucesso}" class="alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}" class="alert-error"
         th:text="${erro}">
    </div>

    <table id="tabelaDespesas" data-tabela-filtros>
        <thead>
        <tr>
            <th>ID <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Tipo <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Descrição <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Categoria <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Data <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Valor <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th data-coluna-acoes>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="lancamento : ${lancamentos}">
            <td th:text="${lancamento.idLancamento}"></td>
            <td th:text="${lancamento.tipoLancamento}"></td>
            <td th:text="${lancamento.descricaoLancamento}"></td>
            <td th:text="${lancamento.categoriaLancamento}"></td>

            <td th:text="${#temporals.format(
                lancamento.dataLancamento, 'dd/MM/yyyy')}">
            </td>

            <td th:text="${#numbers.formatDecimal(
                lancamento.valorTotalLancamento, 1, 2)}">
            </td>

            <td>
                <div class="form-actions">

                    <a th:href="@{/despesas/editar/{id}(
                        id=${lancamento.idLancamento})}"
                       class="btn-secondary">
                        Editar
                    </a>

                    <form th:action="@{/despesas/excluir/{id}(
                        id=${lancamento.idLancamento})}"
                          method="post"
                          onsubmit="return confirm(
                              'Tem certeza que deseja excluir esta despesa?');">

                        <button type="submit" class="btn-secondary">
                            Excluir
                        </button>

                    </form>

                </div>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(lancamentos)}" class="linha-sem-registros">
            <td colspan="7">Nenhuma despesa cadastrada.</td>
        </tr>

        </tbody>
    </table>

</section>

</body>
</html>
