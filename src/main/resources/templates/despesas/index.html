
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Despesas', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Despesas</h1>
            <p>Consulte e gerencie os lançamentos financeiros do seu negócio.</p>
        </div>

        <a th:href="@{/despesas/novo}" class="btn-primary">
            + Nova despesa
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Data</th>
            <th>Valor total</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="lancamento : ${lancamentos}">
            <td th:text="${lancamento.idLancamento}"></td>
            <td th:text="${lancamento.tipoLancamento}"></td>
            <td th:text="${lancamento.descricaoLancamento}"></td>
            <td th:text="${lancamento.categoriaLancamento}"></td>
            <td th:text="${#temporals.format(lancamento.dataLancamento, 'dd/MM/yyyy')}"></td>
            <td th:text="${#numbers.formatDecimal(lancamento.valorTotalLancamento, 1, 2)}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(lancamentos)}">
            <td colspan="6">Nenhuma despesa cadastrada.</td>
        </tr>
        </tbody>
    </table>

</section>

</body>
</html>
