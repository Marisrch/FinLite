
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Registrar saída', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Registrar saída de material</h1>
            <p>Informe os materiais utilizados na produção.</p>
        </div>
    </div>

    <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

    <div th:if="${#lists.isEmpty(materiais)}">
        <p>Nenhum material cadastrado. Cadastre um material antes de registrar uma saída.</p>
        <a th:href="@{/materiais/novo}" class="btn-primary">
            Cadastrar material
        </a>
    </div>

    <form th:unless="${#lists.isEmpty(materiais)}"
          th:action="@{/estoque/movimentacoes/salvar}"
          method="post">

        <div class="form-group">
            <label for="idMaterial">Material</label>

            <select id="idMaterial" name="idMaterial" required>
                <option value="">Selecione um material</option>

                <option th:each="material : ${materiais}"
                        th:value="${material.idMaterial}"
                        th:text="${material.nomeMaterial
                            + ' — Estoque: '
                            + material.quantidadeEstoqueMaterial
                            + ' '
                            + material.unidadeMedidaMaterial}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantidadeMovimentacao">Quantidade utilizada</label>

            <input type="number"
                   id="quantidadeMovimentacao"
                   name="quantidadeMovimentacao"
                   min="0.01"
                   step="0.01"
                   placeholder="Ex.: 2"
                   required>
        </div>

        <div class="form-group">
            <label for="motivoOrigem">Finalidade da saída</label>

            <input type="text"
                   id="motivoOrigem"
                   name="motivoOrigem"
                   maxlength="100"
                   placeholder="Ex.: Produção de uma peça de crochê"
                   required>
        </div>

        <div class="form-info">
            <p>
                A quantidade informada será descontada automaticamente
                do estoque do material selecionado.
            </p>
        </div>

        <div class="form-actions">
            <a th:href="@{/estoque/movimentacoes}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Registrar saída
            </button>
        </div>

    </form>

</section>
</body>
</html>
