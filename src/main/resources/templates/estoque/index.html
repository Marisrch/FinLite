
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Estoque', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Estoque</h1>
            <p>Acompanhe as quantidades disponíveis e identifique materiais que precisam de reposição.</p>
        </div>

        <div class="page-actions">

            <a th:href="@{/estoque/movimentacoes}" class="btn-secondary">
                Histórico de movimentações
            </a>

            <a th:href="@{/materiais/novo}" class="btn-primary">
                + Novo material
            </a>

        </div>
    </div>

    <div th:if="${sucesso}" class="alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert-error"
         th:text="${erro}"></div>

    <table id="tabelaEstoque" data-tabela-filtros>
        <thead>
        <tr>
            <th>Material <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Categoria <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Qtd. atual <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Qtd. mínima <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Unidade <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Custo unit. <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Valor estoque <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th>Situação <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
            <th data-coluna-acoes>Ações</th>

        </tr>
        </thead>

        <tbody>

        <tr th:each="material : ${materiais}">

            <td th:text="${material.nomeMaterial}"></td>

            <td th:text="${material.categoriaMaterial}"></td>

            <td th:text="${#numbers.formatDecimal(material.quantidadeEstoqueMaterial, 1, 2)}"></td>

            <td th:text="${#numbers.formatDecimal(material.quantidadeMinimaMaterial, 1, 2)}"></td>

            <td th:text="${material.unidadeMedidaMaterial}"></td>

            <td th:text="${material.custoUnitarioMaterial != null
                ? 'R$ ' + #numbers.formatDecimal(material.custoUnitarioMaterial, 1, 2)
                : '-'}"></td>

            <td th:text="${material.custoUnitarioMaterial != null
                ? 'R$ ' + #numbers.formatDecimal(material.quantidadeEstoqueMaterial.multiply(material.custoUnitarioMaterial), 1, 2)
                : '-'}"></td>

            <td>
                <span th:if="${material.quantidadeEstoqueMaterial.compareTo(material.quantidadeMinimaMaterial) <= 0}"
                      class="status-baixo">
                    Estoque baixo
                </span>

                <span th:unless="${material.quantidadeEstoqueMaterial.compareTo(material.quantidadeMinimaMaterial) <= 0}"
                      class="status-normal">
                    Normal
                </span>
            </td>


            <td>
                <div class="form-actions">
                    <a th:href="@{/materiais/editar/{id}(id=${material.idMaterial})}"
                       class="btn-secondary">Editar</a>

                    <form th:action="@{/materiais/excluir/{id}(id=${material.idMaterial})}"
                          method="post"
                          onsubmit="return confirm('Tem certeza que deseja excluir este material?');">
                        <button type="submit" class="btn-secondary">Excluir</button>
                    </form>
                </div>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(materiais)}" class="linha-sem-registros">
            <td colspan="9">Nenhum material cadastrado.</td>
        </tr>

        </tbody>
    </table>

</section>

</body>
</html>
