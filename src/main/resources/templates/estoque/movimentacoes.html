
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Movimentações de estoque', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Movimentações de estoque</h1>
            <p>Acompanhe as entradas e saídas dos materiais.</p>
        </div>

        <div class="page-actions">

            <a th:href="@{/estoque}" class="btn-secondary">
                Voltar ao estoque
            </a>

            <a th:href="@{/estoque/movimentacoes/novo}" class="btn-primary">
                Registrar saída
            </a>

        </div>
    </div>

    <div th:if="${sucesso}" class="alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert-error"
         th:text="${erro}"></div>

    <div class="table-container">

        <table id="tabelaMovimentacoes" data-tabela-filtros>

            <thead>
            <tr>
                <th>ID <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th>Data <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th>Material <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th>Tipo <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th>Qtd. <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th>Motivo <button type="button" class="btn-filtro" title="Filtrar">▼</button></th>
                <th data-coluna-acoes>Ações</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="movimentacao : ${movimentacoes}">

                <td th:text="${movimentacao.idMovimentacao}"></td>

                <td th:text="${#temporals.format(
                    movimentacao.dataMovimentacao,
                    'dd/MM/yyyy HH:mm'
                )}"></td>

                <td th:text="${movimentacao.material.nomeMaterial}"></td>

                <td>
                    <span th:if="${movimentacao.tipoMovimentacao == 'ENTRADA'}">
                        Entrada
                    </span>

                    <span th:if="${movimentacao.tipoMovimentacao == 'SAIDA'}">
                        Saída
                    </span>
                </td>

                <td th:text="${#numbers.formatDecimal(
                    movimentacao.quantidadeMovimentacao,
                    1,
                    2
                )}"></td>

                <td th:text="${movimentacao.motivoOrigem != null
                    ? movimentacao.motivoOrigem
                    : '-'}"></td>

                <td>
                    <!-- Permite excluir somente movimentações manuais -->
                    <form th:if="${movimentacao.lancamento == null}"
                          th:action="@{/estoque/movimentacoes/excluir/{id}(id=${movimentacao.idMovimentacao})}"
                          method="post"
                          onsubmit="return confirm('Deseja excluir esta movimentação? O estoque será atualizado.');">

                        <button type="submit" class="btn-secondary">
                            Excluir
                        </button>
                    </form>

                    <!-- Entradas vinculadas a despesas não podem ser excluídas aqui -->
                    <span th:if="${movimentacao.lancamento != null}">
                        -
                    </span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(movimentacoes)}"
                class="linha-sem-registros">

                <td colspan="7">
                    Nenhuma movimentação de estoque registrada.
                </td>
            </tr>

            </tbody>
        </table>

    </div>

</section>
</body>
</html>
