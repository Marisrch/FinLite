
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Nova venda', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Nova venda</h1>
            <p>Preencha os dados para registrar uma venda.</p>
        </div>
    </div>

    <div th:if="${erro}" class="alert alert-error"
         th:text="${erro}">
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <form th:if="${idEmpreendedor != null}"
          th:action="@{/vendas/salvar}"
          th:object="${venda}"
          method="post">

        <input type="hidden"
               name="idEmpreendedor"
               th:value="${idEmpreendedor}">

        <div class="form-group">
            <label for="nomeCliente">Nome do cliente</label>
            <input type="text"
                   id="nomeCliente"
                   th:field="*{nomeCliente}"
                   maxlength="100"
                   placeholder="Nome do cliente"
                   required>
        </div>

        <div class="form-group">
            <label for="produtoPeca">Produto / Peça</label>
            <input type="text"
                   id="produtoPeca"
                   th:field="*{produtoPeca}"
                   maxlength="100"
                   placeholder="Ex.: Bolsa de crochê"
                   required>
        </div>

        <div class="form-group">
            <label for="valorVenda">Valor da venda (R$)</label>
            <input type="number"
                   id="valorVenda"
                   th:field="*{valorVenda}"
                   min="0.01"
                   step="0.01"
                   placeholder="Ex.: 150.00"
                   required>
        </div>

        <div class="form-group">
            <label for="formaPagamento">Forma de pagamento</label>
            <select id="formaPagamento"
                    th:field="*{formaPagamento}"
                    required>
                <option value="">Selecione</option>
                <option value="PIX">PIX</option>
                <option value="DINHEIRO">Dinheiro</option>
                <option value="CARTÃO DE CRÉDITO">Cartão de crédito</option>
                <option value="CARTÃO DE DÉBITO">Cartão de débito</option>
                <option value="TRANSFERÊNCIA">Transferência</option>
                <option value="OUTRO">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="statusVenda">Status da venda</label>
            <select id="statusVenda"
                    th:field="*{statusVenda}"
                    required>
                <option value="">Selecione</option>
                <option value="EM ANDAMENTO">Em andamento</option>
                <option value="CONCLUÍDA">Concluída</option>
                <option value="CANCELADA">Cancelada</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dataEntrega">Data de entrega</label>
            <input type="date"
                   id="dataEntrega"
                   th:field="*{dataEntrega}"
                   required>
        </div>

        <div class="form-group">
            <label for="dataRegistro">Data de registro</label>
            <input type="date"
                   id="dataRegistro"
                   th:field="*{dataRegistro}"
                   required>
        </div>

        <div class="form-actions">
            <a th:href="@{/vendas}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Salvar venda
            </button>
        </div>

    </form>

    <div th:if="${idEmpreendedor == null}">
        <p>Cadastre um empreendedor antes de registrar uma venda.</p>

        <a th:href="@{/empreendedores/novo}"
           class="btn-primary">
            Cadastrar empreendedor
        </a>
    </div>

</section>
</body>
</html>
