
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Nova venda', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <h1>Nova venda</h1>
    <p>Preencha os dados para registrar uma venda.</p>

    <p th:if="${erro}" th:text="${erro}"></p>

    <form th:if="${idEmpreendedor != null}"
          th:action="@{/vendas/salvar}"
          th:object="${venda}"
          method="post">

        <input type="hidden"
               name="idEmpreendedor"
               th:value="${idEmpreendedor}">

        <label>Nome do cliente</label>
        <input type="text" th:field="*{nomeCliente}" required>

        <label>Produto / Peça</label>
        <input type="text" th:field="*{produtoPeca}" required>

        <label>Valor da venda</label>
        <input type="number" step="0.01"
               th:field="*{valorVenda}" min="0.01" required>

        <label>Forma de pagamento</label>
        <input type="text" th:field="*{formaPagamento}" required>

        <label>Status</label>
        <select th:field="*{statusVenda}" required>
            <option value="">Selecione</option>
            <option value="EM ANDAMENTO">Em andamento</option>
            <option value="CONCLUÍDA">Concluída</option>
            <option value="CANCELADA">Cancelada</option>
        </select>

        <label>Data de entrega</label>
        <input type="date" th:field="*{dataEntrega}" required>

        <label>Data de registro</label>
        <input type="date" th:field="*{dataRegistro}" required>

        <button type="submit">Salvar venda</button>
        <a th:href="@{/vendas}">Cancelar</a>

    </form>

    <a th:href="@{/vendas}" th:if="${idEmpreendedor == null}">
        Voltar para vendas
    </a>

</section>
</body>
</html>
