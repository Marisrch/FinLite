
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Vendas', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <div class="page-header">
        <div>
            <h1>Vendas</h1>
            <p>Gerencie as vendas do seu negócio.</p>
        </div>

        <a th:href="@{/vendas/novo}" class="btn-primary">
            + Nova venda
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}" class="alert alert-error"
         th:text="${erro}">
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Produto / Peça</th>
            <th>Valor</th>
            <th>Pagamento</th>
            <th>Status</th>
            <th>Entrega</th>
            <th>Registro</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="venda : ${vendas}">
            <td th:text="${venda.idVenda}"></td>
            <td th:text="${venda.nomeCliente}"></td>
            <td th:text="${venda.produtoPeca}"></td>
            <td th:text="${#numbers.formatDecimal(venda.valorVenda, 1, 2)}"></td>
            <td th:text="${venda.formaPagamento}"></td>
            <td th:text="${venda.statusVenda}"></td>
            <td th:text="${#temporals.format(venda.dataEntrega, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(venda.dataRegistro, 'dd/MM/yyyy')}"></td>

            <td>
                <div class="form-actions">
                    <a th:href="@{/vendas/editar/{id}(id=${venda.idVenda})}"
                       class="btn-secondary">
                        Editar
                    </a>

                    <form th:action="@{/vendas/excluir/{id}(id=${venda.idVenda})}"
                          method="post"
                          onsubmit="return confirm('Tem certeza que deseja excluir esta venda?');">

                        <button type="submit" class="btn-secondary">
                            Excluir
                        </button>
                    </form>
                </div>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(vendas)}">
            <td colspan="9">Nenhuma venda cadastrada.</td>
        </tr>
        </tbody>
    </table>

</section>

</body>
</html>
